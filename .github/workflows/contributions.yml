name: Update contribution graph

on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/contributions.py
      - .github/workflows/contributions.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render graph
        env:
          GH_TOKEN: ${{ secrets.CONTRIB_TOKEN || github.token }}
        run: python3 .github/scripts/contributions.py
      - name: Commit changes
        run: |
          git diff --quiet -- assets/contributions.svg && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898583+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          git commit -m "Update contribution graph"
          git push
